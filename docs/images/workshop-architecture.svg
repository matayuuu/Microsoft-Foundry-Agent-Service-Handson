<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Foundry Agent Service hands-on architecture</title>
  <desc id="desc">Participant and Codespaces connect to a Foundry project containing a Prompt Agent, Foundry IQ, Toolbox, and Hosted Agent. Azure AI Search, Travel Ops API, and Application Insights provide knowledge, tools, and traces.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000000" flood-opacity=".12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C2D91"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F7630C"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#008272"/>
    </marker>
    <style>
      .title { font: 700 30px "Segoe UI", "Noto Sans JP", sans-serif; fill: #1e1e1e; }
      .section { font: 600 19px "Segoe UI", "Noto Sans JP", sans-serif; fill: #323130; }
      .label { font: 600 17px "Segoe UI", "Noto Sans JP", sans-serif; fill: #1e1e1e; text-anchor: middle; }
      .small { font: 400 14px "Segoe UI", "Noto Sans JP", sans-serif; fill: #605e5c; text-anchor: middle; }
      .flow { font: 600 13px "Segoe UI", "Noto Sans JP", sans-serif; fill: #605e5c; text-anchor: middle; }
      .footer { font: 500 15px "Segoe UI", "Noto Sans JP", sans-serif; fill: #323130; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="24" fill="#FAF9F8"/>
  <text x="48" y="55" class="title">Microsoft Foundry Agent Service Hands-on</text>
  <text x="48" y="82" class="section">Contoso 社内出張・経費支援を、Portal と Notebook で段階的に構築</text>

  <g filter="url(#shadow)">
    <rect x="44" y="150" width="180" height="92" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
    <text x="134" y="187" class="label">参加者</text>
    <text x="134" y="216" class="small">Foundry Portal</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="44" y="350" width="180" height="92" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
    <text x="134" y="387" class="label">GitHub Codespaces</text>
    <text x="134" y="416" class="small">Notebook / Terraform</text>
  </g>

  <rect x="300" y="112" width="590" height="438" rx="22" fill="#FFFFFF" stroke="#5C2D91" stroke-width="2"/>
  <text x="330" y="148" class="section">Microsoft Foundry project</text>

  <g filter="url(#shadow)">
    <rect x="485" y="180" width="220" height="76" rx="16" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
    <text x="595" y="225" class="label">Prompt Agent</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="318" width="200" height="82" rx="16" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
    <text x="450" y="350" class="label">Foundry IQ</text>
    <text x="450" y="377" class="small">Knowledge Base</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="318" width="200" height="82" rx="16" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
    <text x="740" y="350" class="label">Toolbox</text>
    <text x="740" y="377" class="small">Travel Ops OpenAPI</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="485" y="455" width="220" height="68" rx="16" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
    <text x="595" y="485" class="label">Hosted Agent</text>
    <text x="595" y="509" class="small">Agent Framework workflow</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="970" y="176" width="190" height="82" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
    <text x="1065" y="209" class="label">Azure AI Search</text>
    <text x="1065" y="236" class="small">合成規程データ</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="970" y="318" width="190" height="82" rx="16" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
    <text x="1065" y="351" class="label">Travel Ops API</text>
    <text x="1065" y="378" class="small">決定的 mock</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="970" y="458" width="190" height="82" rx="16" fill="#D7F5F0" stroke="#008272" stroke-width="2"/>
    <text x="1065" y="491" class="label">Application Insights</text>
    <text x="1065" y="518" class="small">Trace / Metrics</text>
  </g>

  <path d="M224 196 C330 196 380 212 485 218" fill="none" stroke="#0078D4" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="350" y="185" class="flow">Portal</text>

  <path d="M224 396 C340 396 370 475 485 486" fill="none" stroke="#0078D4" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="350" y="438" class="flow">Python source deploy</text>

  <path d="M560 256 C540 285 500 296 470 318" fill="none" stroke="#5C2D91" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <path d="M630 256 C650 285 700 296 720 318" fill="none" stroke="#F7630C" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <path d="M550 359 C730 285 820 217 970 217" fill="none" stroke="#0078D4" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="775" y="260" class="flow">検索・引用</text>

  <path d="M840 359 L970 359" fill="none" stroke="#F7630C" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="905" y="346" class="flow">tool call</text>

  <path d="M705 489 C810 489 865 499 970 499" fill="none" stroke="#008272" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M705 218 C900 218 870 470 970 488" fill="none" stroke="#008272" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-teal)"/>
  <text x="846" y="514" class="flow">telemetry</text>

  <rect x="165" y="584" width="870" height="42" rx="21" fill="#FFFFFF" stroke="#D2D0CE"/>
  <text x="600" y="611" class="footer">既存 Resource Group 内に構築　|　Microsoft Entra ID + RBAC　|　すべて合成データ</text>
</svg>
