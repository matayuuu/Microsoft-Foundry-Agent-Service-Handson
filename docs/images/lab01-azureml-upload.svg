<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Upload the extracted workshop folder to Azure ML User files</title>
  <desc id="desc">The Azure ML Notebooks User files pane receives the extracted top-level workshop folder.</desc>
  <rect width="1000" height="560" rx="20" fill="#f4f7fb"/>
  <rect x="34" y="30" width="932" height="500" rx="14" fill="#fff" stroke="#ccd6e2" stroke-width="2"/>
  <rect x="34" y="30" width="932" height="58" rx="14" fill="#0f6cbd"/>
  <text x="68" y="66" fill="#fff" font-family="Segoe UI, sans-serif" font-size="23" font-weight="600">Azure ML Studio · Notebooks</text>
  <rect x="34" y="88" width="230" height="442" fill="#f8fafc"/>
  <text x="64" y="132" fill="#1e1e1e" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600">User files</text>
  <rect x="52" y="154" width="194" height="44" rx="6" fill="#e5f1fb"/>
  <text x="72" y="182" fill="#005a9e" font-family="Segoe UI, sans-serif" font-size="15">📁 Microsoft-Foundry-...</text>
  <g font-family="Segoe UI, sans-serif" font-size="15" fill="#1e1e1e">
    <text x="92" y="226">📁 .workshop</text>
    <text x="92" y="258">📁 notebooks</text>
    <text x="92" y="290">📁 portal-assets</text>
    <text x="92" y="322">📁 scripts</text>
    <text x="92" y="354">📁 src</text>
  </g>
  <rect x="298" y="120" width="620" height="348" rx="12" fill="#fff" stroke="#b8c5d3" stroke-dasharray="8 6" stroke-width="2"/>
  <path d="M575 216v94m-38-38 38 38 38-38M510 332h130" fill="none" stroke="#0078d4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="608" y="382" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600">Upload the extracted top-level folder</text>
  <text x="608" y="416" text-anchor="middle" fill="#605e5c" font-family="Segoe UI, sans-serif" font-size="15">Do not upload the ZIP or individual files separately.</text>
  <rect x="744" y="104" width="174" height="40" rx="6" fill="#0078d4"/>
  <text x="831" y="130" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">Upload folder</text>
</svg>
