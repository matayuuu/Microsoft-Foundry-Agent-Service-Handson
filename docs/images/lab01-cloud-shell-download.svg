<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Download the single workshop ZIP from Cloud Shell</title>
  <desc id="desc">The Cloud Shell Manage files menu opens Download and selects foundry-workshop-files.zip.</desc>
  <rect width="1000" height="560" rx="20" fill="#f3f6fa"/>
  <rect x="36" y="34" width="928" height="492" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="36" y="34" width="928" height="58" rx="14" fill="#0078d4"/>
  <text x="68" y="70" fill="#fff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600">Azure Cloud Shell</text>
  <rect x="640" y="47" width="170" height="34" rx="5" fill="#fff" opacity=".16"/>
  <text x="725" y="70" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="15">Manage files ▾</text>
  <rect x="640" y="91" width="210" height="118" rx="7" fill="#fff" stroke="#aab6c4"/>
  <text x="666" y="128" fill="#1e1e1e" font-family="Segoe UI, sans-serif" font-size="16">Upload</text>
  <rect x="650" y="145" width="190" height="46" rx="5" fill="#eef6ff"/>
  <text x="666" y="174" fill="#005a9e" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">Download</text>
  <rect x="130" y="168" width="630" height="260" rx="12" fill="#fff" stroke="#8da2b8" stroke-width="2"/>
  <text x="166" y="215" fill="#1e1e1e" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600">Download a file</text>
  <text x="166" y="258" fill="#605e5c" font-family="Segoe UI, sans-serif" font-size="15">File path</text>
  <rect x="166" y="276" width="558" height="50" rx="5" fill="#fff" stroke="#64748b"/>
  <text x="182" y="307" fill="#1e1e1e" font-family="Cascadia Mono, monospace" font-size="14">.workshop/download/foundry-workshop-files.zip</text>
  <rect x="566" y="356" width="158" height="42" rx="6" fill="#0078d4"/>
  <text x="645" y="383" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">Download</text>
  <path d="M810 304h72v80h-72zM828 288h36v42h-36M846 288v58m-15-15 15 15 15-15" fill="none" stroke="#107c10" stroke-width="4" stroke-linejoin="round"/>
  <text x="846" y="413" text-anchor="middle" fill="#107c10" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">One ZIP</text>
  <text x="130" y="476" fill="#605e5c" font-family="Segoe UI, sans-serif" font-size="15">After the download completes, run exit to release the Cloud Shell slot.</text>
</svg>
