<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1880" viewBox="0 0 1640 1880" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Workshop learning flow</title>
  <desc id="diagram-description">Labs 0–1 manually create the resource group, load the custom template with verified defaults and validate Azure bootstrap. Labs 2–6 develop one Prompt Agent in Foundry Portal; Lab 4 uses GitHub Skill ZIPs and common OpenAPI. Lab 7 prepares Codespaces or the same local Dev Container, signs in with Azure CLI, retrieves context through the setup notebook and compares plain and Harness Agents. Lab 8 deploys a source-based intake, policy, reviewer workflow. Lab 9 saves results, removes Hosted Agents, stops/deletes the Codespace and deletes only the dedicated resource group.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0078D4" stroke-width="1.5"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#107C10" stroke-width="1.5"/></marker>
    <style>
      text { fill: #000000; font-family: Arial, Helvetica, sans-serif; font-size: 16px; }
      .container { fill: none; stroke-width: 2; }
      .box { stroke-width: 2; }
      .blue { fill: #CFE4FA; stroke: #0078D4; }
      .purple { fill: #E8DAEF; stroke: #5C2D91; }
      .green { fill: #DFF6DD; stroke: #107C10; }
      .gray { fill: #F3F2F1; stroke: #1e1e1e; }
      .edge { fill: none; stroke: #107C10; stroke-width: 2; marker-end: url(#green-arrow); }
    </style>
  </defs>
  <rect width="1640" height="1880" fill="#ffffff"/>
  <text id="learning-title" x="40" y="50" style="font-size:30px">Learning flow — one Prompt Agent, then reusable code</text>
  <text id="learning-subtitle" x="40" y="118" style="font-size:18px">10 Labs · synthetic data only · no real booking, approval, or payment</text>
  <rect id="shared-preparation" class="container" x="40" y="170" width="1560" height="470" rx="12" stroke="#0078D4"/>
  <text id="preparation-title" x="60" y="212" style="font-size:22px">Labs 0–1 — prepare in Azure Portal</text>
  <rect id="preparation-steps" class="box blue" x="60" y="260" width="1520" height="290" rx="12"/>
  <text id="preparation-steps-text" x="80" y="292" style="font-size:17px">
    <tspan x="80">Lab 0: overview and safety</tspan>
    <tspan x="80" dy="42.5">1. Resource groups &gt; Create: manually create ONE dedicated RG</tspan>
    <tspan x="80" dy="42.5">2. Deploy a custom template &gt; Build your own template in the editor &gt; Load file</tspan>
    <tspan x="80" dy="42.5">3. infra/azuredeploy.json &gt; Subscription + existing RG; keep defaults &gt; Create</tspan>
    <tspan x="80" dy="42.5">4. Deployment Scripts: Search + evaluation preparation &gt; validation &gt; complete</tspan>
    <tspan x="80" dy="42.5">5. Outputs: workshopContext / resourceOutputs / travelApiBaseUrl / foundryPortalUrl</tspan>
  </text>
  <text id="preparation-boundary" x="60" y="596">Common materials live in GitHub. The setup notebook creates .workshop/context.json later.</text>
  <path id="prepare-to-build" d="M415 650 V695" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/>
  <rect id="prompt-learning" class="container" x="40" y="705" width="750" height="720" rx="12" stroke="#5C2D91"/>
  <text id="prompt-title" x="60" y="747" style="font-size:22px">Labs 2–6 — Microsoft Foundry Portal</text>
  <rect id="lab2" class="box purple" x="60" y="810" width="710" height="100" rx="12"/>
  <text id="lab2-text" x="80" y="836">
    <tspan x="80">Lab 2 — Prompt Agent + direct Search</tspan>
    <tspan x="80" dy="40">Create contoso-travel-assistant; Luna 40K TPM</tspan>
  </text>
  <rect id="lab3" class="box purple" x="60" y="925" width="710" height="100" rx="12"/>
  <text id="lab3-text" x="80" y="951">
    <tspan x="80">Lab 3 — Foundry IQ</tspan>
    <tspan x="80" dy="40">Two indexes; gpt-5.5; reuse the same remote knowledge base</tspan>
  </text>
  <rect id="lab4" class="box purple" x="60" y="1040" width="710" height="100" rx="12"/>
  <text id="lab4-text" x="80" y="1066">
    <tspan x="80">Lab 4 — Toolbox / OpenAPI / Skills</tspan>
    <tspan x="80" dy="40">GitHub Skill ZIPs + OpenAPI; set travelApiBaseUrl</tspan>
  </text>
  <rect id="lab5" class="box purple" x="60" y="1155" width="710" height="100" rx="12"/>
  <text id="lab5-text" x="80" y="1181">
    <tspan x="80">Lab 5 — Evaluation</tspan>
    <tspan x="80" dy="40">Seven synthetic rows; gpt-5.5 judge; inspect reasons / traces</tspan>
  </text>
  <rect id="lab6" class="box purple" x="60" y="1270" width="710" height="100" rx="12"/>
  <text id="lab6-text" x="80" y="1296">
    <tspan x="80">Lab 6 — Agent Optimizer</tspan>
    <tspan x="80" dy="40">Compare baseline + one candidate; gpt-5.5; promote only if better</tspan>
  </text>
  <path id="build-to-code" class="edge" d="M800 1090 H840"/>
  <rect id="hosted-learning" class="container" x="850" y="705" width="750" height="720" rx="12" stroke="#107C10"/>
  <text id="hosted-title" x="870" y="747" style="font-size:22px">Labs 7–8 — Codespaces / local Dev Container</text>
  <rect id="lab7-setup" class="box green" x="870" y="810" width="710" height="190" rx="12"/>
  <text id="lab7-setup-text" x="890" y="841">
    <tspan x="890">Post-create: Python 3.12 + 3.13 isolated venvs</tspan>
    <tspan x="890" dy="40">Azure CLI sign-in in container (once)</tspan>
    <tspan x="890" dy="40">00-setup.ipynb: subscription ID + RG name</tspan>
    <tspan x="890" dy="40">Management kernel: Python (Foundry Workshop)</tspan>
  </text>
  <rect id="lab7-agents" class="box green" x="870" y="1030" width="710" height="130" rx="12"/>
  <text id="lab7-agents-text" x="890" y="1066">
    <tspan x="890">Lab 7 — plain Agent &gt; Harness Agent</tspan>
    <tspan x="890" dy="40">Foundry IQ + Toolbox + Skills; plan / todos / execute</tspan>
  </text>
  <rect id="lab8" class="box green" x="870" y="1190" width="710" height="170" rx="12"/>
  <text id="lab8-text" x="890" y="1226">
    <tspan x="890">Lab 8 — Hosted Agent source remote build</tspan>
    <tspan x="890" dy="40">intake_agent &gt; policy_agent &gt; reviewer_agent</tspan>
    <tspan x="890" dy="40">Deploy / delete: management venv + confirmation</tspan>
  </text>
  <text id="hosted-kernel" x="870" y="1394" style="font-size:14px">Labs 7/8 kernel: Python (Foundry Hosted Agent)</text>
  <path id="workflow-to-cleanup" class="edge" d="M1225 1435 V1490"/>
  <rect id="shared-cleanup" class="container" x="40" y="1500" width="1560" height="290" rx="12" stroke="#1e1e1e"/>
  <text id="cleanup-title" x="60" y="1542" style="font-size:22px">Lab 9 — trace comparison and complete cleanup</text>
  <rect id="cleanup-steps" class="box gray" x="60" y="1595" width="1520" height="150" rx="12"/>
  <text id="cleanup-steps-text" x="80" y="1626">
    <tspan x="80">Save / export &gt; delete Hosted Agent / versions &gt; Codespace Stop / Delete</tspan>
    <tspan x="80" dy="40">Azure Portal &gt; Delete resource group (own dedicated RG only) &gt; verify deletion</tspan>
    <tspan x="80" dy="40">Deleting deployment history does not delete resources</tspan>
  </text>
  <text id="learning-footer" x="40" y="1836">Shared GitHub repository in both environments; no manual folder upload or environment archive download.</text>
</svg>
