<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1152" viewBox="0 0 1440 1152" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">学習の流れ — ひとつの Agent から、workflow へ</title>
  <desc id="diagram-description">Lab 0・1 で準備し、Lab 2〜6 で同じ Prompt Agent を拡張する。Lab 7 では Foundry IQ・Toolbox・Skills を plain Agent と Harness Agent から再利用する。Lab 8 では token 消費を抑えるため intake、policy、reviewer の通常 Agent を sequential workflow として Hosted Agent にデプロイする。Lab 7 の session state には依存しない。Lab 9 で Prompt と Hosted の trace を比較し、既存 resource group を残して演習リソースを片付ける。実際の予約・承認・精算は行わない。</desc>
  <defs>
    <radialGradient id="ambient" cx="100%" cy="0%" r="90%">
      <stop offset="0" stop-color="#18334e"/>
      <stop offset="1" stop-color="#091321"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 H 0 V 48" fill="none" stroke="#b7d3f0" stroke-opacity=".035"/>
    </pattern>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="m 2 1 4 4-4 4" fill="none" stroke="#55dbd0" stroke-width="1.5"/>
    </marker>
    <style>
      text { fill: #e9f1fa; font-family: "Bahnschrift", "Aptos", "Yu Gothic", Meiryo, sans-serif; }
      .mono { font-family: "Cascadia Code", Consolas, "Yu Gothic", Meiryo, monospace; }
      .muted { fill: #a2b4c8; }
      .cyan { fill: #55dbd0; }
      .blue { fill: #89b8ff; }
      .rule { fill: none; stroke: #30475f; stroke-width: 1; }
      .edge { fill: none; stroke: #55dbd0; stroke-width: 1.5; }
      .surface { fill: #0e1c2d; stroke: #30475f; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="1152" rx="16" fill="url(#ambient)"/>
  <rect width="1440" height="1152" rx="16" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1439" height="1151" rx="16" fill="none" stroke="#30475f"/>
  <path d="M 48 64 H 64 M 56 56 V 72 M 1376 64 H 1392 M 1384 56 V 72" class="rule"/>
  <text id="learning-eyebrow" class="mono cyan" x="80" y="72" font-size="20" letter-spacing="3">LEARNING PATH</text>
  <text id="learning-meta" class="mono muted" x="1360" y="72" font-size="20" text-anchor="end">10 LABS / 4 STAGES</text>
  <text id="learning-title" x="64" y="134" font-size="38" font-weight="600">ひとつの Agent から、workflow へ。</text>

  <rect id="shared-preparation" class="surface" x="64" y="180" width="1312" height="104" rx="8"/>
  <text id="preparation-stage" class="mono muted" x="88" y="224" font-size="20">01 / PREPARE</text>
  <text id="preparation-labs" class="mono blue" x="88" y="257" font-size="22">Lab 0–1</text>
  <text id="shared-preparation-text" x="320" y="224" font-size="28" font-weight="600">共通の準備</text>
  <text id="preparation-outcome" class="muted" x="320" y="260" font-size="23">Codespaces を開く → 既存 RG 内に Azure 環境を準備</text>
  <path id="prepare-to-build" class="edge" data-from="shared-preparation" data-to="prompt-learning-container" d="M 104 284 V 322" marker-end="url(#arrowhead)"/>

  <path id="prompt-learning-container" class="rule" d="M 64 340 H 656"/>
  <path d="M 64 340 H 144" fill="none" stroke="#89b8ff" stroke-width="3"/>
  <text id="prompt-stage" class="mono blue" x="64" y="374" font-size="20" letter-spacing="1">02 / BUILD</text>
  <text id="prompt-learning-surface" class="mono muted" x="656" y="374" font-size="19" text-anchor="end">FOUNDRY PORTAL</text>
  <text id="prompt-learning-title" x="64" y="422" font-size="30" font-weight="600">同じ Prompt Agent を育てる</text>
  <text id="prompt-learning-intro" class="muted" x="64" y="458" font-size="22">Lab 2–6 / 検索・実行・評価を少しずつ追加</text>

  <text id="lab2-number" class="mono blue" x="64" y="514" font-size="22">Lab 2</text>
  <text id="lab2-prompt-text" x="176" y="514" font-size="28">Prompt Agent</text>
  <text id="lab2-outcome" class="muted" x="176" y="548" font-size="22">役割を設定し、規程の直接検索を確認</text>
  <path id="lab2-to-lab3" class="rule" d="M 176 568 H 656"/>

  <text id="lab3-number" class="mono blue" x="64" y="600" font-size="22">Lab 3</text>
  <text id="lab3-knowledge-text" x="176" y="600" font-size="28">Foundry IQ</text>
  <text id="lab3-outcome" class="muted" x="176" y="634" font-size="22">複数の規程を横断検索し、出典を読む</text>
  <path id="lab3-to-lab4" class="rule" d="M 176 654 H 656"/>

  <text id="lab4-number" class="mono blue" x="64" y="686" font-size="22">Lab 4</text>
  <text id="lab4-toolbox-text" x="176" y="686" font-size="28">Tool / Skill / Toolbox</text>
  <text id="lab4-outcome" class="muted" x="176" y="720" font-size="22">必要な tool を発見し、API で計算する</text>
  <path id="lab4-to-lab5" class="rule" d="M 176 740 H 656"/>

  <text id="lab5-number" class="mono blue" x="64" y="772" font-size="22">Lab 5</text>
  <text id="lab5-evaluation-text" x="176" y="772" font-size="28">Evaluation</text>
  <text id="lab5-outcome" class="muted" x="176" y="806" font-size="22">同じ質問集で回答と判定理由を点検</text>
  <path id="lab5-to-lab6" class="rule" d="M 176 826 H 656"/>

  <text id="lab6-number" class="mono blue" x="64" y="858" font-size="22">Lab 6</text>
  <text id="lab6-optimizer-text" x="176" y="858" font-size="28">Optimizer</text>
  <text id="lab6-outcome" class="muted" x="176" y="892" font-size="22">指示文の候補を比較し、採用を判断</text>

  <path id="build-to-code" class="edge" data-from="prompt-learning-container" data-to="hosted-learning-container" d="M 676 408 H 732" marker-end="url(#arrowhead)"/>
  <path id="hosted-learning-container" class="rule" d="M 752 340 H 1376"/>
  <path d="M 752 340 H 832" fill="none" stroke="#55dbd0" stroke-width="3"/>
  <text id="hosted-stage" class="mono cyan" x="752" y="374" font-size="20" letter-spacing="1">03 / REUSE &amp; DEPLOY</text>
  <text id="hosted-learning-surface" class="mono muted" x="1376" y="374" font-size="19" text-anchor="end">PYTHON</text>
  <text id="hosted-learning-title" x="752" y="422" font-size="30" font-weight="600">同じ資産をコードで再利用</text>
  <text id="lab7-independent-note-text" class="muted" x="752" y="458" font-size="22">Lab 7–8 / Foundry IQ をコードで再利用</text>

  <rect id="lab7-comparison" class="surface" x="752" y="486" width="624" height="160" rx="8"/>
  <text id="lab7-number" class="mono cyan" x="776" y="522" font-size="22">Lab 7</text>
  <text id="lab7-policy-text" x="888" y="522" font-size="26">plain Agent → Harness Agent</text>
  <text id="lab7-connections" class="muted" x="776" y="572" font-size="22">Foundry IQ / Toolbox / Skills を接続</text>
  <text id="lab7-planner-text" class="muted" x="776" y="608" font-size="22">plan / todo / memory の動きを比較する</text>
  <path id="code-to-workflow" class="edge" data-from="lab7-comparison" data-to="lab8-deployment" d="M 800 646 V 674" marker-end="url(#arrowhead)"/>

  <rect id="lab8-deployment" class="surface" x="752" y="686" width="624" height="160" rx="8"/>
  <text id="lab8-number" class="mono cyan" x="776" y="722" font-size="22">Lab 8</text>
  <text id="lab7-hosted-text" x="888" y="722" font-size="26">Hosted Agent にデプロイ</text>
  <text id="lab7-reviewer-text" class="muted" x="776" y="772" font-size="22">intake → policy → reviewer</text>
  <text id="lab8-outcome" class="muted" x="776" y="808" font-size="22">通常 Agent 3つの sequential workflow を配置</text>

  <path d="M 752 870 V 922" fill="none" stroke="#55dbd0" stroke-width="2"/>
  <text id="lab8-source-note" class="muted" x="776" y="886" font-size="20">Lab 8 は checked-in source を使用。</text>
  <text id="lab8-session-note" class="muted" x="776" y="918" font-size="20">Lab 7 の session state には依存しない。</text>
  <path id="workflow-to-cleanup" class="edge" data-from="lab8-deployment" data-to="shared-cleanup" d="M 1376 766 H 1400 V 948 H 1328 V 968" marker-end="url(#arrowhead)"/>

  <rect id="shared-cleanup" class="surface" x="64" y="980" width="1312" height="104" rx="8"/>
  <text id="cleanup-stage" class="mono muted" x="88" y="1024" font-size="20">04 / FINISH</text>
  <text id="cleanup-lab" class="mono cyan" x="88" y="1057" font-size="22">Lab 9</text>
  <text id="shared-cleanup-text" x="320" y="1024" font-size="28" font-weight="600">trace の比較と cleanup</text>
  <text id="cleanup-outcome" class="muted" x="320" y="1060" font-size="22">Prompt / Hosted を比較 → 演習リソースを削除（既存 RG は残す）</text>
  <text id="learning-footer" class="muted" x="64" y="1124" font-size="20">合成データのみ。実際の予約・承認・精算は行いません。</text>
</svg>
