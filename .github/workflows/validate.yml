name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - dev-custom-template

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r .devcontainer/requirements-dev.txt -e ".[dev]" -e "./src/travel-api[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test
        run: python -m pytest
      - name: Verify shared GitHub materials
        run: python scripts/build_common_assets.py --check
      - name: Validate shell syntax
        run: make shell-validate

  hosted-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/hosted-agent/requirements.txt
      - name: Install Hosted Agent dependencies
        run: python -m pip install -r .devcontainer/requirements-dev.txt -r src/hosted-agent/requirements.txt
      - name: Test Hosted Agent
        run: python -m pytest tests/unit/hosted_agent tests/contract/hosted_agent -q
      - name: Lint Hosted Agent
        run: |
          python -m ruff check src/hosted-agent tests/unit/hosted_agent tests/contract/hosted_agent
          python -m ruff format --check src/hosted-agent tests/unit/hosted_agent tests/contract/hosted_agent

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Bicep compiler
        run: az bicep install --version v0.46.1
      - name: Verify generated Portal template
        run: make bicep-validate

  bootstrap-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the exact bootstrap CLI image
        shell: bash
        run: |
          cli_version=$(jq -er '.resources[] | select(.type == "Microsoft.Resources/deploymentScripts") | .properties.azCliVersion' infra/azuredeploy.json)
          [[ "$cli_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          runtime_context=$(mktemp -d "$RUNNER_TEMP/bootstrap-runtime.XXXXXX")
          cp pyproject.toml README.md "$runtime_context/"
          docker build --build-arg "AZURE_CLI_VERSION=$cli_version" \
            --file tests/runtime/bootstrap.Dockerfile \
            --tag workshop-bootstrap-runtime:validation "$runtime_context"

  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start the common Codespaces/local container
        id: container
        shell: bash
        run: |
          npx --yes @devcontainers/cli@0.89.0 up --workspace-folder "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/workshop-container.json"
          container_id=$(jq -er '.containerId' "$RUNNER_TEMP/workshop-container.json")
          echo "id=$container_id" >> "$GITHUB_OUTPUT"
      - name: Verify both isolated runtimes and kernels
        shell: bash
        run: |
          npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder "$GITHUB_WORKSPACE" bash -lc '
            set -euo pipefail
            "$WORKSHOP_MANAGEMENT_PYTHON" -c "import sys, azure.ai.projects, travel_api; assert sys.version_info[:2] == (3, 12)"
            "$WORKSHOP_HOSTED_PYTHON" -c "import sys, agent_framework, agent_framework_foundry_hosting; assert sys.version_info[:2] == (3, 13)"
            "$WORKSHOP_MANAGEMENT_PYTHON" -m jupyter kernelspec list --json | "$WORKSHOP_MANAGEMENT_PYTHON" -c "import json,sys; assert set((\"foundry-workshop\", \"foundry-hosted-agent\")) <= json.load(sys.stdin)[\"kernelspecs\"].keys()"
          '
      - name: Remove the test container
        if: always() && steps.container.outputs.id != ''
        run: docker rm --force "${{ steps.container.outputs.id }}"

  travel-api-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag travel-ops-api:validation src/travel-api
      - name: Smoke test image
        shell: bash
        run: |
          container_id=$(docker run --detach --publish 8080:8080 travel-ops-api:validation)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
