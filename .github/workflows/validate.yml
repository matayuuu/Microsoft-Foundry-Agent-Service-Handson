name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - dev-custom-template

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]" -e "./src/travel-api[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test
        run: python -m pytest
      - name: Validate shell syntax
        run: make shell-validate

  hosted-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/hosted-agent/requirements.txt
      - name: Install Hosted Agent dependencies
        run: python -m pip install -r src/hosted-agent/requirements.txt pytest ruff ipykernel
      - name: Test Hosted Agent
        run: python -m pytest tests/unit/hosted_agent tests/contract/hosted_agent -q
      - name: Lint Hosted Agent
        run: |
          python -m ruff check src/hosted-agent tests/unit/hosted_agent tests/contract/hosted_agent
          python -m ruff format --check src/hosted-agent tests/unit/hosted_agent tests/contract/hosted_agent

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Bicep compiler
        run: az bicep install --version v0.46.1
      - name: Verify generated Portal template
        run: make bicep-validate

  bootstrap-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the exact bootstrap CLI image
        shell: bash
        run: |
          cli_version=$(jq -er '.resources[] | select(.type == "Microsoft.Resources/deploymentScripts") | .properties.azCliVersion' infra/azuredeploy.json)
          [[ "$cli_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          runtime_context=$(mktemp -d "$RUNNER_TEMP/bootstrap-runtime.XXXXXX")
          cp pyproject.toml README.md "$runtime_context/"
          docker build --build-arg "AZURE_CLI_VERSION=$cli_version" \
            --file tests/runtime/bootstrap.Dockerfile \
            --tag workshop-bootstrap-runtime:validation "$runtime_context"

  travel-api-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag travel-ops-api:validation src/travel-api
      - name: Smoke test image
        shell: bash
        run: |
          container_id=$(docker run --detach --publish 8080:8080 travel-ops-api:validation)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
