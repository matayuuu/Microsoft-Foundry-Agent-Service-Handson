[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-ops-api"
version = "1.0.0"
description = "Deterministic mock Travel Ops API for the Contoso travel/expense workshop scenario"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.118.0",
  "pydantic==2.11.7",
  "uvicorn==0.37.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest>=8.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["travel_api*"]

[tool.pytest.ini_options]
addopts = "-ra"
